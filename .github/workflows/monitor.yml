name: Thrift Conversion Monitor

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      bank_name:
        description: 'Force-analyze a specific bank (leave blank for normal weekly scan)'
        required: false
        default: ''
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: thrift_state.json
          key: thrift-state-${{ github.run_id }}
          restore-keys: thrift-state-

      - name: Run monitor
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_FROM:          ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FORCE_BANK: ${{ github.event.inputs.bank_name }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN:            ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
        run: python thrift_monitor.py

      - name: Save state
        uses: actions/cache@v4
        with:
          path: thrift_state.json
          key: thrift-state-${{ github.run_id }}
